[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cmne"
dynamic = ["version"]
description = "Contextual Minimum-Norm Estimates: LSTM-based spatiotemporal MEG/EEG source estimation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Christoph Dinh", email = "christoph.dinh@mne-cpp.org" },
    { name = "John G. Samuelsson" },
]
keywords = [
    "MEG", "EEG", "magnetoencephalography", "electroencephalography", "source localization",
    "source estimation", "inverse problem", "neuroimaging", "spatiotemporal", "LSTM",
    "deep learning", "PyTorch", "ONNX", "MNE-Python", "dSPM",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "mne>=1.6",
    "pooch>=1.6",
    "torch>=2.2",
]

[project.optional-dependencies]
onnx = ["onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.1"]
viz = ["matplotlib>=3.7"]
test = ["pytest>=8", "pytest-cov>=5", "cmne[onnx]"]
dev = ["cmne[test,viz]", "ruff>=0.6", "build"]

[project.scripts]
cmne = "cmne.cli:main"

[project.urls]
Homepage = "https://github.com/chdinh/cmne"
Paper = "https://doi.org/10.3389/fnins.2021.552666"
Preprint = "https://arxiv.org/abs/1909.02636"
Issues = "https://github.com/chdinh/cmne/issues"

[tool.setuptools.dynamic]
version = { attr = "cmne._version.__version__" }

[tool.setuptools.packages.find]
include = ["cmne*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: longer end-to-end tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]